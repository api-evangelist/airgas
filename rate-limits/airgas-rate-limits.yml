specification: API Commons Rate Limits
specificationVersion: '0.1'
schema: https://raw.githubusercontent.com/api-evangelist/interface-research/main/schema/api-commons.yml#/$defs/RateLimits
provider: Airgas
providerId: airgas
created: '2026-05-04'
generated: '2026-08-30'
modified: '2026-08-30'
method: searched
source: https://www.airgas.com/robots.txt
limit_count: 0
note: >-
  REPLACES a fabricated scaffold. The 2026-05-04 bulk sweep wrote five invented API rate limits here
  (10/min free, 100/min professional, 1000/min enterprise) and an invented X-RateLimit-* header set.
  Airgas publishes no API and therefore no API rate limits, no throttling headers and no documented
  429 semantics. limit_count is an honest zero. The only rate governance Airgas publishes anywhere is
  a crawler directive in robots.txt, recorded below as crawl_policy — it governs web crawlers, NOT an
  API, and must not be read as an API limit.
headers: {}
responseCodes: {}
limits: []
crawl_policy:
  source: https://www.airgas.com/robots.txt
  status: 200
  request_rate: 1/5
  visit_time: 0530-1900 UTC window declared as 1900-0530
  note: >-
    Non-standard legacy robots.txt directives (Request-rate, Visit-time). These constrain crawlers of
    the www.airgas.com storefront. They are not an API rate limit and are recorded only so the zero
    above is distinguishable from "not checked".
evidence:
  - url: https://www.airgas.com/robots.txt
    status: 200
  - url: https://www.airgas.com/openapi.json
    status: 404
    note: No contract exists in which rate-limit headers or a 429 response could be documented.
